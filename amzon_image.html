<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .main {
            width: 350px;
            height: 350px;
            border: 1px solid black;
            margin-left: 100px;
            margin-top: 50px;
        }

        .small {
            width: 100px;
            height: 100px;
            border: 1px solid black;
            margin-left: 30px;
            margin-top: 20px;
        }

        .move {
            width: 350px;
            height: 350px;
            border: 1px solid black;
            position: absolute;
            left: 470px;
            top: 50px;
            background-repeat: no-repeat;
            display: none;
            overflow: hidden;
            background-size: 800px 800px;
            background-position: center;
            cursor: crosshair;
        }
    </style>
</head>

<body>

    <div>
        <img src="https://m.media-amazon.com/images/I/619xMvtqClL._SY679_.jpg" alt="" id="mainimage" class="main">
    </div>
    <div class="image">
        <img src="https://m.media-amazon.com/images/I/619xMvtqClL._SY679_.jpg" alt="" class="small">
        <img src="https://m.media-amazon.com/images/I/71B6sCb+lqL._SY679_.jpg" alt="" class="small">
        <img src="https://m.media-amazon.com/images/I/81IWea1qhjL._SY679_.jpg" alt="" class="small">
        <img src="https://m.media-amazon.com/images/I/815C7zYqB2L._SY679_.jpg" alt="" class="small">
        <img src="https://m.media-amazon.com/images/I/61OZ7SSlEzL._SY679_.jpg" alt="" class="small">
    </div>
    <div class="move">

    </div>

    <script src="amazon_image.js"></script>
</body>

</html>
